name: Release Obsidian assets

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Confirm tag and manifest version match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const m=require('./manifest.json'); if(m.version!==process.env.RELEASE_TAG) throw new Error('tag and manifest versions differ')"
      - run: npm run verify
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" main.js manifest.json styles.css --generate-notes --title "Omnichannel Diary ${{ github.ref_name }}"
